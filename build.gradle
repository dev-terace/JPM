plugins {
    id 'java-library'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'


}

group = 'com.github.dev-terace'
version = property('version')

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}





gradlePlugin {
    plugins {
        jpmPlugin {
            id = 'com.github.jpm.plugin'
            // 반드시 변경하신 '전체 패키지 경로'를 포함한 풀 네임을 적어주세요!
            implementationClass = 'io.jpm.config.plugin.JpmPlugin'
        }
    }
}



// 중복 파일 에러 방지 (JitPack 빌드 필수)
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE



}




dependencies {

    // Gradle 플러그인 개발 시 필요한 API 포함
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'com.tngtech.archunit:archunit:1.0.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    annotationProcessor 'org.immutables:value:2.10.1'
    compileOnly         'org.immutables:value:2.10.1'
    // AutoService 설정
    compileOnly gradleApi()
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    compileOnly files(findToolsJar())


}


static def findToolsJar() {
    def javaHome = System.getProperty('java.home')

    // JDK 직접 경로
    def toolsJar = new File(javaHome, '../lib/tools.jar')
    if (toolsJar.exists()) return toolsJar

    // JRE 안에 있는 경우
    toolsJar = new File(javaHome, 'lib/tools.jar')
    if (toolsJar.exists()) return toolsJar

    // JAVA_HOME 환경변수로 fallback
    def javaHomeEnv = System.getenv('JAVA_HOME')
    if (javaHomeEnv) {
        toolsJar = new File(javaHomeEnv, 'lib/tools.jar')
        if (toolsJar.exists()) return toolsJar
    }

    throw new GradleException("tools.jar를 찾을 수 없습니다. JAVA_HOME을 확인해주세요.")
}



jar {
   /* finalizedBy shadowJar*/ //로컬 실행 시 주석 처리
}


shadowJar {
    zip64 = true
    archiveClassifier.set('') // 파일명에 -all 안 붙임 (일반 jar인 척 위장)
    mergeServiceFiles()       // AutoService 설정 파일 합치기

}



publishing {
    publications {
        mavenJava(MavenPublication) {
            // components.java 대신 shadowJar를 직접 지정하여 강제로 배포
            artifact shadowJar

            groupId = group
            artifactId = 'JPM'
            version = version
        }
    }
}
